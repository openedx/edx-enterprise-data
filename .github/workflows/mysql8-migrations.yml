name: Migrations check on mysql8

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  check_migrations:
    name: check migrations
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ 3.12 ]

    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system Packages
      run: |
        sudo apt-get update
    - name: Get pip cache dir
      id: pip-cache-dir
      run: |
        echo "::set-output name=dir::$(pip cache dir)"
    - name: Cache pip dependencies
      id: cache-dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pip-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements/pip_tools.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Ubuntu and sql Versions
      run: |
        lsb_release -a
        mysql -V
    - name: Install Python dependencies
      run: |
        pip install -r requirements/dev.txt
        pip uninstall -y mysqlclient
        pip install --no-binary mysqlclient mysqlclient
    - name: Initiate Services
      run: |
        sudo /etc/init.d/mysql start
    - name: Reset mysql password
      run: |
        cat <<EOF | mysql -h 127.0.0.1 -u root --password=root
          UPDATE mysql.user SET authentication_string = null WHERE user = 'root';
          FLUSH PRIVILEGES;
        EOF
    - name: Run migrations
      env:
        DATABASES: default
        DB_ENGINE: django.db.backends.mysql
        DB_USER: root
        DB_PASSWORD: ""
        DB_HOST: localhost
        DB_PORT: 3306
      run: |
        echo "Running the migrations."
        for db in $DATABASES;
        do
          echo "CREATE DATABASE IF NOT EXISTS db_$db;" | sudo mysql -u root
          export DB_NAME=db_$db
          python manage.py migrate --noinput --run-syncdb --database "$db" --settings=enterprise_data.settings.test
        done
